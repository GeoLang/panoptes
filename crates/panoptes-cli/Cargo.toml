[package]
name = "panoptes-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "panoptes"
path = "src/main.rs"

[features]
default = []
onnx = ["panoptes-core/onnx"]

[dependencies]
panoptes-core = { path = "../panoptes-core" }
panoptes-raster = { path = "../panoptes-raster" }
panoptes-vector = { path = "../panoptes-vector" }
panoptes-models = { path = "../panoptes-models" }
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"
serde_json = "1"
rayon = "1"
geoplumb = { git = "https://github.com/GeoLang/geoplumb.git", branch = "master" }
geoplumb-server = { git = "https://github.com/GeoLang/geoplumb.git", branch = "master" }
projicio-core = { git = "https://github.com/GeoLang/projicio.git", branch = "master" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
terrano-core = { git = "https://github.com/GeoLang/terrano.git", branch = "master" }
tempfile = "3"
