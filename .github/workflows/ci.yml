name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-ci:
    uses: GeoLang/.github/.github/workflows/rust-ci.yml@main
    with:
      all_features: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  onnx:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_VERSION: 1.20.1
      ONNXRUNTIME_WHEEL_URL: https://files.pythonhosted.org/packages/47/42/2f71f5680834688a9c81becbe5c5bb996fd33eaed5c66ae0606c3b1d6a02/onnxruntime-1.20.1-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      ONNXRUNTIME_WHEEL_SHA256: bb71a814f66517a65628c9e4a2bb530a6edd2cd5d87ffa0af0f6f773a027d99e
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ort loads the runtime with dlopen, so nothing ships it: CI has to supply one
      # onnxruntime's pypi wheel ships libonnxruntime.so beside its python bindings
      - name: Install ONNX Runtime
        run: |
          wheel="$RUNNER_TEMP/onnxruntime.whl"
          curl -sSfL -o "$wheel" "$ONNXRUNTIME_WHEEL_URL"
          echo "$ONNXRUNTIME_WHEEL_SHA256  $wheel" | sha256sum -c -
          library="onnxruntime/capi/libonnxruntime.so.$ONNXRUNTIME_VERSION"
          unzip -q "$wheel" "$library" -d "$RUNNER_TEMP"
          echo "ORT_DYLIB_PATH=$RUNNER_TEMP/$library" >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy --all-targets --features onnx -- -D warnings
      - name: Test
        run: cargo test --all --features onnx

  gdal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev
      - name: Clippy
        run: cargo clippy --all-targets --features gdal -- -D warnings
      - name: Test
        run: cargo test --all --features gdal
